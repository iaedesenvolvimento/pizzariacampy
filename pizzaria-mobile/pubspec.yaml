name: pizzaria_mobile
description: Aplicativo mobile da Pizzaria Campy.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.1.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.7
  web_socket_channel: ^3.0.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalogo-piloto/a-moda-do-chefe-i.png
