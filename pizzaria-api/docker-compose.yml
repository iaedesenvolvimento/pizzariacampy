services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pizzaria}
      POSTGRES_USER: ${POSTGRES_USER:-pizzaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: development
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pizzaria}:${POSTGRES_PASSWORD:-change-me-development}@db:5432/${POSTGRES_DB:-pizzaria}
      SECRET_KEY: ${SECRET_KEY:-development-secret-key-change-at-least-32-chars}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-pizzaria-campy/products}
    ports:
      - "8000:8000"
    volumes:
      - payment_uploads:/app/uploads
      - ./catalog-images-manifest.json:/app/catalog-images-manifest.json:ro
      - ./assets/catalog-images:/app/assets/catalog-images:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  payment_uploads:
